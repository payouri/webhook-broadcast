info:
  description: Operator-facing admin contract emitted from Zod schemas in packages/contract. Ingest `POST /ingest/{slug}` is intentionally NOT in this document.
  title: webhook-broadcast Admin API
  version: 0.1.0
openapi: 3.1.0
paths:
  /channels:
    get:
      operationId: listChannels
      parameters:
        - in: query
          name: cursor
          schema:
            type: string
        - in: query
          name: limit
          schema:
            default: 50
            maximum: 100
            minimum: 1
            type: integer
        - description: Exact match on channel.slug (UNIQUE) — at most one row
          in: query
          name: slug
          schema:
            $ref: "#/components/schemas/__schema0"
            description: Exact match on channel.slug (UNIQUE) — at most one row
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChannelList"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Error
      security:
        - OperatorBearer: []
      summary: List channels
      tags:
        - channels
    post:
      operationId: createChannel
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChannelCreate"
        required: true
      responses:
        "201":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
          description: Created
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Error
      security:
        - OperatorBearer: []
      summary: Create channel
      tags:
        - channels
  /channels/{channelId}:
    delete:
      operationId: deleteChannel
      parameters:
        - in: path
          name: channelId
          required: true
          schema:
            $ref: "#/components/schemas/Id"
      responses:
        "204":
          description: Soft-deleted
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Error
      security:
        - OperatorBearer: []
      summary: Soft-delete channel (sets deletedAt)
      tags:
        - channels
    get:
      operationId: getChannel
      parameters:
        - in: path
          name: channelId
          required: true
          schema:
            $ref: "#/components/schemas/Id"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Error
      security:
        - OperatorBearer: []
      tags:
        - channels
    patch:
      operationId: updateChannel
      parameters:
        - in: path
          name: channelId
          required: true
          schema:
            $ref: "#/components/schemas/Id"
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChannelUpdate"
        required: true
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Channel"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Error
      security:
        - OperatorBearer: []
      tags:
        - channels
  /channels/{channelId}/broadcasts:
    get:
      operationId: listChannelBroadcasts
      parameters:
        - in: path
          name: channelId
          required: true
          schema:
            $ref: "#/components/schemas/Id"
        - in: query
          name: cursor
          schema:
            type: string
        - in: query
          name: limit
          schema:
            default: 50
            maximum: 100
            minimum: 1
            type: integer
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BroadcastList"
          description: OK
        default:
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorEnvelope"
          description: Error
      security:
        - OperatorBearer: []
      summary: Channel activity (newest first)
      tags:
        - broadcasts
  /channels/{channelId}/broadcasts/{broadcastId}:
    get:
      operationId: getBroadcastDetail
      parameters:
        - in: path
          name: channelId
          required: true
          schema:
            $ref: "#/components/schemas/Id"
        - in: path
          name: broadcastId
          required: true
          schema:
            $ref: "#/components/schemas/Id"
      responses:
        "200":
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/BroadcastDetail"
          description: OK
        default:
          content:
