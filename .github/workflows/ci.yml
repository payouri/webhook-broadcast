name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm contract:check
      # The two documentation-drift guards (issue #111): the boot env surface
      # against `.env.example` and ADR 0008, and DESIGN.md's token frontmatter
      # against `styles.css`. Both name the offending key or token on failure.
      - run: pnpm docs:check
      - run: pnpm typecheck
      # Guards the three-project Vitest split (issue #105): a test file that
      # matches no project's include never runs, and the suite stays green.
      - run: pnpm test:check-projects
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm format
