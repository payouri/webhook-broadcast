server {
    # 8080, not 80: the unprivileged image's master process is not root and
    # cannot bind a privileged port.
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Container-local liveness probe — answers without touching the SPA
    # bundle or the api upstream.
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    # Same-origin proxy to the api service (compose network) so the
    # dashboard's HttpOnly session cookie (ADR 0005) is same-site.
    #
    # This path space overlaps the client-side router (issue #42: a Channel's
    # own URL is /channels/:id, with /:tab and /:broadcastId beyond it) — a hard
    # reload on one of those URLs is a browser navigation, not an API call, and
    # must get the SPA shell rather than a JSON 404 from the admin API. Browser
    # navigations always send `Accept: text/html…`; this app's own fetch calls
    # never do, so branch on that instead of the path.
    location ~ ^/(auth|channels|broadcasts|deliveries)(/|$) {
        if ($http_accept ~* "text/html") {
            return 418;
        }
        error_page 418 = /index.html;

        proxy_pass http://api:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
